name: Component catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-catalog.yml
    with:
      build-only: true
    # The reusable workflow declares deploy permissions as a ceiling.
    # Its build job uses contents: read and receives no secrets.
    permissions:
      contents: read
      deployments: write

  deploy-storybook:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: tangle-network/sandbox-ui/.github/workflows/deploy-catalog.yml@e07a5d4b551d6993420d20e4f0452a7a192261ac
    permissions:
      contents: read
      deployments: write
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
