name: Deploy component catalog
on:
  workflow_call:
    inputs:
      build-only:
        description: Prepare the immutable catalog artifact without deployment secrets
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
permissions:
  contents: read
  deployments: write
jobs:
  build:
    if: >-
      inputs.build-only && github.repository == 'tangle-network/sandbox-ui' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook
      - name: Bind review states to the built source
        run: node scripts/build-catalog-manifest.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static-${{ github.sha }}
          path: storybook-static
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: >-
      !inputs.build-only && github.repository == 'tangle-network/sandbox-ui' && (
        (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on:
      group: public-app-production
      labels: [self-hosted, ci-deploy]
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      CATALOG_BRANCH: ${{ github.event_name == 'pull_request' && format('review-pr-{0}', github.event.pull_request.number) || 'main' }}
    concurrency:
      group: storybook-${{ github.event_name == 'pull_request' && format('review-pr-{0}', github.event.pull_request.number) || 'main' }}
      cancel-in-progress: false
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && format('review-pr-{0}', github.event.pull_request.number) || 'main' }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            if [[ "$TARGET_BRANCH" == main ]]; then
              echo '::error::Cloudflare deployment credentials are missing.'
              exit 1
            fi
            echo 'Catalog preview skipped because deployment credentials are missing.' >> "$GITHUB_STEP_SUMMARY"
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.credentials.outputs.present == 'true'
        with:
          name: storybook-static-${{ github.sha }}
          path: storybook-static
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: steps.credentials.outputs.present == 'true'
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy storybook-static --project-name=sandbox-ui-storybook --branch=${{ env.CATALOG_BRANCH }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the immutable deployment serves this exact catalog
        if: steps.credentials.outputs.present == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync('storybook-static/catalog-manifest.json', 'utf8'));
          const url = new URL(process.env.DEPLOYMENT_URL);
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.pages.dev') || url.username || url.password) throw new Error('Missing or invalid immutable Pages deployment URL');
          let observed;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch(new URL('/catalog-manifest.json', url), { signal: AbortSignal.timeout(10000), redirect: 'error' });
              if (response.ok) { observed = await response.json(); break; }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          if (observed?.sourceSha !== expected.sourceSha || observed?.indexSha256 !== expected.indexSha256) throw new Error('Hosted catalog did not match the tested artifact');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Component review\n\nImmutable catalog: ${url.href}\n\nSource: \`${expected.sourceSha}\`\n\nManifest: ${new URL('/catalog-manifest.json', url).href}\n\nFixture evidence only; product flows and visual approval remain separate checks.\n`);
          NODE
