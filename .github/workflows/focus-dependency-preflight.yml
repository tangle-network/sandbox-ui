name: Focus dependency preflight

on:
  pull_request:
    paths:
      - scripts/verify-focus-dependencies.mjs
      - scripts/verify-focus-dependencies.test.mjs
      - scripts/publish-package.mjs
      - .github/workflows/focus-dependency-preflight.yml
  workflow_dispatch:
    inputs:
      brand-version:
        description: Exact published brand version
        default: '1.8.0'
        required: true
        type: string
      ui-version:
        description: Exact published ui version
        default: '11.10.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the verifier using the owned script-test runner
        run: pnpm exec vitest run scripts/verify-focus-dependencies.test.mjs
      - name: Verify actual registry bytes and installed exports
        env:
          BRAND_VERSION: ${{ inputs.brand-version || '1.8.0' }}
          UI_VERSION: ${{ inputs.ui-version || '11.10.0' }}
        run: |
          set -o pipefail
          node scripts/verify-focus-dependencies.mjs "$BRAND_VERSION" "$UI_VERSION" | tee "$RUNNER_TEMP/focus-preflight.log"
      - name: Record the evidence location and scope
        if: always()
        run: |
          printf '%s\n' '## Focus dependency preflight' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'The job log contains registry integrity and clean installed-export results. Failure blocks adoption. This job never publishes, changes a lockfile, merges a PR, or proves rendered focus compliance.' >> "$GITHUB_STEP_SUMMARY"
