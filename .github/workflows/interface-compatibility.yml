name: Interface peer compatibility

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - src/**
      - scripts/package-smoke.mjs
      - scripts/interface-package-contract.mjs
      - .github/workflows/interface-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Interface ${{ matrix.interface }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        interface: [1.0.0, 2.0.0, 3.0.0, 5.2.0]
    env:
      GOMEMLIMIT: 700MiB
      GOMAXPROCS: "2"
      GOGC: "50"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the exact supported Interface floor
        if: matrix.interface != '5.2.0'
        run: pnpm add --save-dev --save-exact @tangle-network/agent-interface@${{ matrix.interface }}
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test --maxWorkers=2
      - name: Pack the artifact under review once
        id: package
        run: |
          TARBALL_PATH=$(./scripts/pack-package.sh "${RUNNER_TEMP}/sandbox-ui-compat-${GITHUB_RUN_ID}")
          echo "path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"
      - name: Install Chromium for the maintained packed consumer contract
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify the exact Interface floor with maintained packed checks
        env:
          SANDBOX_UI_TARBALL: ${{ steps.package.outputs.path }}
          SANDBOX_UI_AGENT_INTERFACE_VERSION: ${{ matrix.interface }}
        run: pnpm test:package
      - name: Verify package re-export identity
        run: pnpm test:bridge
