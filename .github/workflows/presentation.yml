name: Presentation compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/presentation.yml'
      - 'src/primitives/**'
      - 'src/styles/**'
      - 'scripts/*presentation*'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
      # Migration bootstrap: generate the exact published-peer lock candidate
      # with the repository's package manager, never invent lock integrities.
      # This read-only job cannot commit, publish or alter the frozen release.
      # Replace with frozen install once the reviewed candidate is committed.
      - name: Generate canonical peer lock candidate
        run: pnpm update --dev --save-exact --lockfile-only @tangle-network/ui@11.13.0 @tangle-network/brand@1.10.0
      - name: Retain candidate for review
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=presentation-candidate.tar.gz -czf presentation-candidate.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: presentation-lock-candidate
          path: presentation-candidate.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Uncommitted lock changes are not acceptance
        run: git diff --exit-code -- package.json pnpm-lock.yaml
