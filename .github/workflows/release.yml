name: Auto Release & Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  # Decides whether this package version still needs publishing and, when it
  # does, proves the packed artifact before the publish job starts.
  verify:
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether this version publishes
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NAME=$(jq -r '.name' package.json)
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org 2>/dev/null | grep -qx "$VERSION" &&
             gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "$NAME@$VERSION is on npm and has a GitHub Release; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.decide.outputs.publish == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.publish == 'true'
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        if: steps.decide.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        if: steps.decide.outputs.publish == 'true'
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Pack release artifact
        if: steps.decide.outputs.publish == 'true'
        id: package
        run: |
          PACK_DIR="${RUNNER_TEMP}/sandbox-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARBALL_PATH=$(./scripts/pack-package.sh "$PACK_DIR")
          echo "path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"

      # The self-hosted runners have no sudo; they provide the browser libraries.
      - name: Install Chromium for packed consumer proof
        if: steps.decide.outputs.publish == 'true'
        run: pnpm exec playwright install chromium

      - name: Test packed artifact
        if: steps.decide.outputs.publish == 'true'
        env:
          SANDBOX_UI_TARBALL: ${{ steps.package.outputs.path }}
        run: pnpm test:package

      - name: Test embedded app consumer without terminal peers
        if: steps.decide.outputs.publish == 'true'
        env:
          SANDBOX_UI_TARBALL: ${{ steps.package.outputs.path }}
        run: pnpm test:embedded-app-package

      - name: Test oldest supported agent interface
        if: steps.decide.outputs.publish == 'true'
        env:
          SANDBOX_UI_TARBALL: ${{ steps.package.outputs.path }}
          SANDBOX_UI_AGENT_INTERFACE_VERSION: 1.0.0
        run: pnpm test:package

      - name: Upload the tested release artifact
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-ui-package
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Publish the exact tarball verified on the self-hosted runner. npm's trusted
  # publishing OIDC is unavailable there, so npmjs uses the repository token.
  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: [self-hosted, ci-public]
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3

      - name: Download the tested release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandbox-ui-package
          path: ${{ runner.temp }}/sandbox-ui-package

      - name: Locate release artifact
        id: package
        run: |
          mapfile -t packages < <(find "$RUNNER_TEMP/sandbox-ui-package" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "::error::Expected one release tarball, found ${#packages[@]}."
            exit 1
          fi
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish and verify npm artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          node scripts/publish-package.mjs
          "${{ steps.package.outputs.path }}"
          https://registry.npmjs.org
          latest

      - name: Publish and verify GitHub Packages artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/publish-package.mjs
          "${{ steps.package.outputs.path }}"
          https://npm.pkg.github.com
          latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v${VERSION}"
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk '/\^\{\}$/ { peeled=$1 } !/\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }')

          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Tag ${TAG} points to ${TAG_SHA}, expected tested commit ${GITHUB_SHA}" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists at tested commit ${GITHUB_SHA}; skipping"
          elif [[ -n "$TAG_SHA" ]]; then
            gh release create "$TAG" --verify-tag --generate-notes
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
