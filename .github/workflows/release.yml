name: Auto Release & Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Pack release artifact
        id: package
        run: |
          PACK_DIR="${RUNNER_TEMP}/sandbox-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARBALL_PATH=$(./scripts/pack-package.sh "$PACK_DIR")
          echo "path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for packed consumer proof
        run: pnpm exec playwright install --with-deps chromium

      - name: Test packed artifact
        env:
          SANDBOX_UI_TARBALL: ${{ steps.package.outputs.path }}
        run: pnpm test:package

      - name: Test embedded app consumer without terminal peers
        env:
          SANDBOX_UI_TARBALL: ${{ steps.package.outputs.path }}
        run: pnpm test:embedded-app-package

      - name: Test oldest supported agent interface
        env:
          SANDBOX_UI_TARBALL: ${{ steps.package.outputs.path }}
          SANDBOX_UI_AGENT_INTERFACE_VERSION: 1.0.0
        run: pnpm test:package

      - name: Install trusted-publishing npm
        run: npm install --global npm@12.1.0

      - name: Publish and verify npm artifact
        run: >-
          node scripts/publish-package.mjs
          "${{ steps.package.outputs.path }}"
          https://registry.npmjs.org
          latest
          --provenance

      - name: Publish and verify GitHub Packages artifact
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node scripts/publish-package.mjs
          "${{ steps.package.outputs.path }}"
          https://npm.pkg.github.com
          latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v${VERSION}"
          TAG_SHA=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | awk '/\^\{\}$/ { peeled=$1 } !/\^\{\}$/ { direct=$1 } END { print peeled ? peeled : direct }')

          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Tag ${TAG} points to ${TAG_SHA}, expected tested commit ${GITHUB_SHA}" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists at tested commit ${GITHUB_SHA}; skipping"
          elif [[ -n "$TAG_SHA" ]]; then
            gh release create "$TAG" --verify-tag --generate-notes
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
