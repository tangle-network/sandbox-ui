name: Auto Release & Publish

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for version change
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_VERSION=$(jq -r '.version' package.json)
          if ! gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.changed == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v5
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install, build, and publish
        if: steps.version.outputs.changed == 'true'
        run: |
          # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
          npm install -g npm@latest
          pnpm install --frozen-lockfile
          pnpm run build
          # No NODE_AUTH_TOKEN: with id-token:write + a configured trusted
          # publisher, npm authenticates via OIDC. Passing a token here forces
          # token-auth instead (and our scoped tokens 404 on this package).
          # setup-node wrote an _authToken=${NODE_AUTH_TOKEN} line; with the
          # env unset it expands empty — strip it so npm falls back to OIDC.
          npm pkg get name >/dev/null 2>&1 || true
          if [ -f "$HOME/.npmrc" ]; then sed -i '/_authToken=/d' "$HOME/.npmrc" || true; fi
          npm publish --provenance --access public

      - name: Publish to GitHub Packages
        if: steps.version.outputs.changed == 'true'
        run: |
          cat > .npmrc <<EOF
          @tangle-network:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --generate-notes
