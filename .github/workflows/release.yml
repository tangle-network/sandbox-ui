name: Auto Release & Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    uses: tangle-network/sandbox-ui/.github/workflows/trusted-release.yml@ab33b2e0a64c06c11feae6a04a450366b537f9f4
    # GitHub checks every job in the called file against this ceiling, including github-release, which this phase
    # skips; a read-only ceiling fails the whole run at startup. The prepare job keeps the file's contents: read token.
    permissions:
      contents: write
      packages: write
    with:
      phase: prepare

  release:
    needs: prepare
    if: needs.prepare.outputs.npm-pending == 'true'
    permissions:
      contents: read
      id-token: write
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sandbox-ui-release
          path: ${{ runner.temp }}/release
      - name: Verify the qualified bytes
        run: cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS
      - name: Install trusted-publishing npm
        run: npm install --global npm@12.1.0

      - name: Admit the release version
        uses: tangle-network/agent-runtime/.github/actions/admit-release@7a8a935077e77af78ebd549e8670acf274e963ba
        with:
          tarballs: ${{ runner.temp }}/release/package.tgz

      - name: Publish and verify npm artifact
        run: >-
          node "${{ runner.temp }}/release/publish-package.mjs"
          "${{ runner.temp }}/release/package.tgz"
          https://registry.npmjs.org
          latest
          --provenance


  github-release:
    needs: [prepare, release]
    if: always() && needs.prepare.result == 'success' && (needs.release.result == 'success' || needs.prepare.outputs.npm-pending == 'false')
    uses: tangle-network/sandbox-ui/.github/workflows/trusted-release.yml@ab33b2e0a64c06c11feae6a04a450366b537f9f4
    permissions:
      contents: write
      packages: write
    with:
      phase: github-release
