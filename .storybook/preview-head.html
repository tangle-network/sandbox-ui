<!--
  Storybook is a font consumer (the library itself ships no webfonts; see
  src/styles/globals.css). The brand tokens reference Inter / Geist (sans +
  display), Geist Mono (mono), plus Outfit / Manrope. Load them as real
  webfonts here so headings get their display voice and runtime text gets the
  mono voice instead of falling back to UI sans.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
